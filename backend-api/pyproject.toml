[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrascope-backend-api"
version = "0.1.0"
description = "TerraScope backend API service scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"]

[tool.setuptools.packages.find]
where = ["src"]
