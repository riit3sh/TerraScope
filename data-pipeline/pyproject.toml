[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrascope-data-pipeline"
version = "0.1.0"
description = "TerraScope data pipeline service scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "psycopg[binary]>=3.2,<4", "requests>=2.32,<3", "geographiclib>=2,<3", "pandas>=2.2,<3", "jsonschema>=4.26,<5", "sqlalchemy>=2.0,<3", "geoalchemy2>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]
