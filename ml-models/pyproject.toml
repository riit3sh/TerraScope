[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrascope-ml-models"
version = "0.1.0"
description = "TerraScope machine learning service scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "numpy>=2.2,<3", "jsonschema>=4.26,<5", "chromadb>=0.5,<1", "sentence-transformers>=3,<6", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
