services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terrascope
      POSTGRES_USER: terrascope
      POSTGRES_PASSWORD: terrascope
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data-pipeline/db/init.sql:/docker-entrypoint-initdb.d/001-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrascope -d terrascope"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-pipeline:
    build:
      context: .
      dockerfile: data-pipeline/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://terrascope:terrascope@postgres:5432/terrascope}
      SATELLITE_PROVIDER: ${SATELLITE_PROVIDER:-appeears}
      SATELLITE_DEMO_FALLBACK: ${SATELLITE_DEMO_FALLBACK:-true}
      NASA_APPEEARS_USERNAME: ${NASA_APPEEARS_USERNAME:-}
      NASA_APPEEARS_PASSWORD: ${NASA_APPEEARS_PASSWORD:-}
      NASA_APPEEARS_TOKEN: ${NASA_APPEEARS_TOKEN:-}
      NASA_APPEEARS_API_URL: ${NASA_APPEEARS_API_URL:-https://appeears.earthdatacloud.nasa.gov/api}
      NASA_APPEEARS_PRODUCT: ${NASA_APPEEARS_PRODUCT:-HLSS30.020}
      NASA_APPEEARS_B04_LAYER: ${NASA_APPEEARS_B04_LAYER:-B04}
      NASA_APPEEARS_B08_LAYER: ${NASA_APPEEARS_B08_LAYER:-B08}
      NASA_APPEEARS_B11_LAYER: ${NASA_APPEEARS_B11_LAYER:-B11}
      NASA_APPEEARS_CLOUD_LAYER: ${NASA_APPEEARS_CLOUD_LAYER:-}
      NASA_APPEEARS_POLL_SECONDS: ${NASA_APPEEARS_POLL_SECONDS:-10}
      NASA_APPEEARS_MAX_WAIT_SECONDS: ${NASA_APPEEARS_MAX_WAIT_SECONDS:-150}
      TERRASCOPE_SATELLITE_CACHE_PATH: ${TERRASCOPE_SATELLITE_CACHE_PATH:-/app/.cache/terrascope_satellite.json}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-terrascope-local-demo/0.1.0}
      RERA_SEED_PATH: ${RERA_SEED_PATH:-/app/data/raw/maharera_seed.csv}
      # Local Tamil Nadu data built on the host by `terrascope.cmd fetch-data`.
      TERRASCOPE_TN_DATA_DIR: /app/tn-data
      OSM_OVERPASS_FALLBACK: ${OSM_OVERPASS_FALLBACK:-false}
    ports:
      - "8001:8001"
    volumes:
      - satellite-cache:/app/.cache
      - ./tn-data:/app/tn-data:ro
    depends_on:
      postgres:
        condition: service_healthy

  ml-models:
    build:
      context: .
      dockerfile: ml-models/Dockerfile
    environment:
      DATA_PIPELINE_URL: http://data-pipeline:8001
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_GROUNDED_TIMEOUT_SECONDS: ${GROQ_GROUNDED_TIMEOUT_SECONDS:-15}
      GROQ_EXPLANATION_TIMEOUT_SECONDS: ${GROQ_EXPLANATION_TIMEOUT_SECONDS:-12}
      CHROMA_STORE_PATH: /app/.chroma/terrascope
    ports:
      - "8002:8002"
    volumes:
      - chroma-store:/app/.chroma
    depends_on:
      - data-pipeline

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://terrascope:terrascope@postgres:5432/terrascope}
      DATA_PIPELINE_URL: http://data-pipeline:8001
      ML_MODELS_URL: http://ml-models:8002
      FRONTEND_URL: http://localhost:5173
      BACKEND_STORE_PATH: /app/data/terrascope_backend.sqlite3
      EVALUATE_READ_TIMEOUT_SECONDS: ${EVALUATE_READ_TIMEOUT_SECONDS:-90}
      VALUATION_MODEL_PATH: ${VALUATION_MODEL_PATH:-/app/valuation/artifacts/land_price_model.joblib}
      VALUATION_MAX_SUPPORT_DISTANCE_KM: ${VALUATION_MAX_SUPPORT_DISTANCE_KM:-25}
      VALUATION_MIN_SUPPORTING_OBSERVATIONS: ${VALUATION_MIN_SUPPORTING_OBSERVATIONS:-5}
      VALUATION_ALLOW_SYNTHETIC: ${VALUATION_ALLOW_SYNTHETIC:-false}
    ports:
      - "8000:8000"
    volumes:
      - backend-store:/app/data
    depends_on:
      - postgres
      - data-pipeline
      - ml-models

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: npm run preview -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend-api

volumes:
  postgres-data:
  backend-store:
  chroma-store:
  satellite-cache:
