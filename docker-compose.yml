services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terrascope
      POSTGRES_USER: terrascope
      POSTGRES_PASSWORD: terrascope
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data-pipeline/db/init.sql:/docker-entrypoint-initdb.d/001-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrascope -d terrascope"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-pipeline:
    build:
      context: .
      dockerfile: data-pipeline/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://terrascope:terrascope@postgres:5432/terrascope}
      SENTINELHUB_CLIENT_ID: ${SENTINELHUB_CLIENT_ID:-demo-sentinelhub-client-id}
      SENTINELHUB_CLIENT_SECRET: ${SENTINELHUB_CLIENT_SECRET:-demo-sentinelhub-client-secret}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-terrascope-local-demo/0.1.0}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  ml-models:
    build:
      context: .
      dockerfile: ml-models/Dockerfile
    environment:
      DATA_PIPELINE_URL: http://data-pipeline:8001
      GROQ_API_KEY: ${GROQ_API_KEY:-demo-groq-api-key}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8002:8002"
    depends_on:
      - data-pipeline

  backend-api:
    build:
      context: ./backend-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://terrascope:terrascope@postgres:5432/terrascope}
      DATA_PIPELINE_URL: http://data-pipeline:8001
      ML_MODELS_URL: http://ml-models:8002
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - data-pipeline
      - ml-models

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: npm run preview -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend-api

volumes:
  postgres-data:
